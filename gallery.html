<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon · all signs</title>
  <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .gallery { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 1fr); gap: 18px; padding: 18px; flex: 1; min-height: 0; }
    .list { overflow-y: auto; padding: 16px; }
    .list h3 { margin: 12px 0 8px; color: var(--muted); font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; }
    .list .chips { margin-bottom: 4px; }
    pre { margin: 0; padding: 14px; max-height: 32vh; overflow: auto; font-size: 12px; color: #bfe6ff; background: rgba(0, 6, 20, 0.7); border-top: 1px solid var(--panel-border); white-space: pre-wrap; }
    @media (max-width: 900px) { .gallery { grid-template-columns: 1fr; } .gallery .stage-panel { height: 55vh; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">NEON</span>
      <a class="pill-btn" href="index.html">← Translator</a>
    </div>
  </header>

  <main class="gallery">
    <section class="panel stage-panel">
      <canvas id="figure"></canvas>
      <div class="caption"><div id="caption-sign" class="caption-sign"></div></div>
    </section>
    <section class="panel">
      <div id="list" class="list"></div>
      <pre id="json">Click a sign to play it and see its data.</pre>
    </section>
  </main>

  <script type="module">
    // Preview page: plays any sign in data/asl-signs.json and shows its JSON.
    // Edit the JSON file, save, refresh this page, click the sign.
    import { planSigns, restStep } from './js/engine/planner.js';
    import { createFigure } from './js/ui/figure.js';
    import { createPlayer } from './js/ui/player.js';

    const db = await (await fetch('data/asl-signs.json', { cache: 'no-store' })).json();
    const player = createPlayer(createFigure(document.getElementById('figure')), restStep(db));
    const caption = document.getElementById('caption-sign');
    player.onStep((step) => { caption.textContent = step.label; });

    // For letters, hide the word list so "I" plays the letter, not the word I/ME
    const lettersOnly = { ...db, words: {}, aliases: {} };

    function section(title, entries, source) {
      const h = document.createElement('h3');
      h.textContent = title;
      const chips = document.createElement('div');
      chips.className = 'chips';
      for (const [name, sign] of entries) {
        const btn = document.createElement('button');
        btn.className = 'chip';
        btn.textContent = name;
        btn.addEventListener('click', () => {
          player.play(planSigns([name], source).steps);
          document.getElementById('json').textContent = JSON.stringify(sign, null, 2);
        });
        chips.appendChild(btn);
      }
      document.getElementById('list').append(h, chips);
    }

    section('Words', Object.entries(db.words), db);
    section('Letters and numbers', Object.entries(db.letters), lettersOnly);
  </script>
</body>
</html>
